<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>A4 Barcode Print</title>

<style>
@page {
    size: A4;
    margin: 10mm;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
}

.no-print {
    margin: 10px;
}

@media print {
    .no-print {
        display: none;
    }
}

/* ======================
   A4 layouts
====================== */
#page {
    display: grid;
    gap: 5mm;
    padding: 10mm;
}

#page.layout-a {
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 35mm;
}

#page.layout-b {
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 25mm;
}

/* ======================
   Label
====================== */
.label {
    border: 1px dashed #ccc;
    padding: 2mm;
    box-sizing: border-box;
    text-align: center;
}

.label img {
    max-width: 100%;
    height: auto;
}

.label .text {
    font-size: 8pt;
    margin-top: 2mm;
    word-break: break-all;
}

/* ======================
   CSV Drag & Drop
====================== */
#dropzone {
    border: 2px dashed #999;
    padding: 15px;
    margin-bottom: 10px;
    text-align: center;
    color: #555;
}
#dropzone.dragover {
    background: #f0f0f0;
}

/* ======================
   Status
====================== */
#counter, #summary {
    margin-top: 5px;
    font-size: 9pt;
}
#summary {
    font-weight: bold;
}
</style>
</head>

<body>

<div class="no-print">

    <div id="dropzone">
        📂 Drag & drop a CSV file (first column = barcode)
    </div>

    <textarea id="input" rows="5" cols="60"
        placeholder="1 barcode per line"></textarea>

    <div id="counter">Barcodes detected: 0</div>
    <div id="summary"></div>

    <br>

    <button onclick="loadExample()">Load example</button>
    <button onclick="generate()">Generate barcodes</button>
    <button onclick="setLayout('a')">Layout A</button>
    <button onclick="setLayout('b')">Layout B</button>
    <button onclick="exportPDF()">Export PDF</button>
    <button onclick="window.print()">Print A4</button>
</div>

<div id="page" class="layout-a"></div>

<script>
/* ======================
   Helpers
====================== */
function getLines() {
    return document.getElementById('input').value
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(Boolean);
}

function updateCounter() {
    document.getElementById('counter').textContent =
        `Barcodes detected: ${getLines().length}`;
}

/* ======================
   Layout switch
====================== */
function setLayout(type) {
    const page = document.getElementById('page');
    page.classList.remove('layout-a', 'layout-b');
    page.classList.add(`layout-${type}`);
}

/* ======================
   Example loader
====================== */
function loadExample() {
    const example = `(255)8711576008926812726881(3902)2500
(01)08711576008926(10)ABC123
(01)09506000134352(21)98765`;

    document.getElementById('input').value = example;
    updateCounter();
}

/* ======================
   Barcode generation
====================== */
async function generate() {
    const lines = getLines();
    const page = document.getElementById('page');
    const summary = document.getElementById('summary');

    page.innerHTML = '';
    summary.textContent = '';

    if (!lines.length) {
        alert('No barcodes entered');
        return;
    }

    const res = await fetch(
        `/generate?texts=${encodeURIComponent(lines.join('\n'))}`
    );

    if (!res.ok) {
        alert(await res.text());
        return;
    }

    const data = await res.json();

    let ok = 0;
    let fail = 0;

    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'label';

        if (item.image) {
            ok++;
            div.innerHTML = `
                <img src="${item.image}">
                <div class="text">${item.text}</div>
            `;
        } else {
            fail++;
            div.innerHTML = `
                <div style="color:red;font-size:8pt">
                    ERROR<br>${item.text}<br>${item.error}
                </div>
            `;
        }
        page.appendChild(div);
    });

    summary.textContent = `✅ ${ok} generated — ❌ ${fail} errors`;
}

/* ======================
   PDF export
====================== */
function exportPDF() {
    window.print();
}

/* ======================
   CSV Drag & Drop
====================== */
const dropzone = document.getElementById('dropzone');
const textarea = document.getElementById('input');

dropzone.addEventListener('dragover', e => {
    e.preventDefault();
    dropzone.classList.add('dragover');
});

dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('dragover');
});

dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');

    const file = e.dataTransfer.files[0];
    if (!file || !file.name.endsWith('.csv')) {
        alert('Only CSV files allowed');
        return;
    }

    const reader = new FileReader();
    reader.onload = () => {
        const lines = reader.result
            .split(/\r?\n/)
            .map(l => l.split(',')[0].trim())
            .filter(Boolean);

        textarea.value = lines.join('\n');
        updateCounter();
    };
    reader.readAsText(file);
});

textarea.addEventListener('input', updateCounter);
</script>

</body>
</html>
