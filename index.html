<!DOCTYPE html>
<html>
<body>

<textarea id="input" rows="5" cols="50">
(255)8711576008926812726881(3902)2500
</textarea><br><br>

<button onclick="generate()">Genereer</button>

<div id="output"></div>

<script>
async function generate() {
    console.log('Klik werkt');

    const input = document.getElementById('input').value;

    const res = await fetch('/generate?texts=' + encodeURIComponent(input));
    const data = await res.json();

    document.getElementById('output').innerHTML =
        data.map(b =>
            b.image
              ? `<img src="${b.image}"><br>`
              : `<div style="color:red">${b.error}</div>`
        ).join('');
}
</script>

</body>
</html>
