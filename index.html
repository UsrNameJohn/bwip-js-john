<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A4 Barcode Generator</title>

<style>
@page {
    size: A4;
    margin: 10mm;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
}

.no-print {
    margin: 10px;
}

@media print {
    .no-print { display: none; }
}

/* ======================
   A4 layouts
====================== */
#page {
    display: grid;
    gap: 5mm;
    padding: 10mm;
}

#page.layout-a {
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 35mm;
}

#page.layout-b {
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 25mm;
}

/* ======================
   Label
====================== */
.label {
    border: 1px dashed #ccc;
    padding: 2mm;
    box-sizing: border-box;
    text-align: center;
}

.label img {
    max-width: 100%;
    height: auto;
}

.label .text {
    font-size: 8pt;
    margin-top: 2mm;
    word-break: break-all;
}

/* ======================
   CSV Drag & Drop
====================== */
#dropzone {
    border: 2px dashed #999;
    padding: 15px;
    margin-bottom: 10px;
    text-align: center;
    color: #555;
}

#dropzone.dragover {
    background: #f0f0f0;
}

#summary {
    margin-top: 8px;
    font-size: 9pt;
}
</style>
</head>

<body>

<div class="no-print">

    <div id="dropzone">
        📂 Drop CSV file here (first column = barcode)
    </div>

    <textarea id="input" rows="5" cols="60"
        placeholder="One GS1 barcode per line"></textarea>
    <br><br>

    <button onclick="generate()">Generate barcodes</button>
    <button onclick="setLayout('a')">Layout A</button>
    <button onclick="setLayout('b')">Layout B</button>
    <button onclick="exportPDF()">Export PDF</button>
    <button onclick="window.print()">Print A4</button>

    <div id="summary"></div>
</div>

<div id="page" class="layout-a"></div>

<script>
/* ======================
   Helpers
====================== */
function getLines() {
    return document.getElementById('input')
        .value
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(Boolean);
}

/* ======================
   Layout switch
====================== */
function setLayout(type) {
    const page = document.getElementById('page');
    page.classList.remove('layout-a', 'layout-b');
    page.classList.add(`layout-${type}`);
}

/* ======================
   GS1 validation
====================== */
function validateGS1(text) {
    const errors = [];

    if (!/^[0-9()]+$/.test(text)) {
        errors.push("Invalid characters");
    }

    let depth = 0;
    for (const c of text) {
        if (c === '(') depth++;
        if (c === ')') depth--;
        if (depth < 0) errors.push("Unbalanced brackets");
    }
    if (depth !== 0) errors.push("Unbalanced brackets");

    const regex = /\((\d{2,4})\)([^()]+)/g;
    let match, found = false;

    while ((match = regex.exec(text)) !== null) {
        found = true;
        const ai = match[1];
        const data = match[2];

        if (!/^\d+$/.test(data)) {
            errors.push(`AI ${ai}: non-numeric data`);
        }

        if (ai === "01" && data.length !== 14) {
            errors.push("AI 01 must be 14 digits");
        }

        if (ai === "17" && data.length !== 6) {
            errors.push("AI 17 must be YYMMDD");
        }
    }

    if (!found) errors.push("No valid (AI) blocks");

    return errors;
}

/* ======================
   Barcode generation
====================== */
async function generate() {
    const page = document.getElementById("page");
    const summary = document.getElementById("summary");

    page.innerHTML = "";
    summary.textContent = "";

    const lines = getLines();
    if (!lines.length) {
        summary.textContent = "⚠️ No barcodes entered";
        return;
    }

    const valid = [];
    let invalid = 0;

    lines.forEach(text => {
        const errors = validateGS1(text);
        if (errors.length) {
            invalid++;
            const div = document.createElement("div");
            div.className = "label";
            div.innerHTML = `
                <div style="color:red;font-size:8pt">
                    ❌ Invalid GS1<br>
                    ${text}<br>
                    ${errors.join("<br>")}
                </div>`;
            page.appendChild(div);
        } else {
            valid.push(text);
        }
    });

    if (!valid.length) {
        summary.textContent = `❌ ${invalid} invalid barcodes`;
        return;
    }

    const res = await fetch(
        `/generate?texts=${encodeURIComponent(valid.join("\n"))}`
    );

    if (!res.ok) {
        summary.textContent = "❌ Server error";
        return;
    }

    const data = await res.json();

    data.forEach(item => {
        const div = document.createElement("div");
        div.className = "label";

        if (item.image) {
            div.innerHTML = `
                <img src="${item.image}">
                <div class="text">${item.text}</div>
            `;
        } else {
            div.innerHTML = `
                <div style="color:red;font-size:8pt">
                    ❌ ${item.text}<br>${item.error}
                </div>
            `;
        }
        page.appendChild(div);
    });

    summary.textContent =
        `✅ ${valid.length} generated, ❌ ${invalid} blocked`;
}

/* ======================
   PDF export
====================== */
function exportPDF() {
    window.print();
}

/* ======================
   CSV Drag & Drop
====================== */
const dropzone = document.getElementById('dropzone');
const textarea = document.getElementById('input');

dropzone.addEventListener('dragover', e => {
    e.preventDefault();
    dropzone.classList.add('dragover');
});

dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('dragover');
});

dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');

    const file = e.dataTransfer.files[0];
    if (!file || !file.name.endsWith('.csv')) {
        alert('CSV files only');
        return;
    }

    const reader = new FileReader();
    reader.onload = () => {
        const lines = reader.result
            .split(/\r?\n/)
            .map(l => l.split(',')[0].trim())
            .filter(Boolean);

        textarea.value = lines.join('\n');
    };
    reader.readAsText(file);
});
</script>

</body>
</html>
