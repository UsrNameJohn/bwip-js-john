<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A4 Barcode Generator</title>

<style>
@page { size: A4; margin: 10mm; }

body { font-family: Arial, sans-serif; margin: 0; }

.no-print { margin: 10px; }
@media print { .no-print { display:none; } }

#langbar button {
    margin-right: 4px;
    cursor: pointer;
}

/* Layouts */
#page {
    display: grid;
    gap: 5mm;
    padding: 10mm;
}
#page.layout-a { grid-template-columns: repeat(2,1fr); grid-auto-rows:35mm; }
#page.layout-b { grid-template-columns: repeat(3,1fr); grid-auto-rows:25mm; }

/* Labels */
.label {
    border: 1px dashed #ccc;
    padding: 2mm;
    text-align: center;
}
.label img { max-width:100%; }
.label .text { font-size:8pt; margin-top:2mm; word-break:break-all; }

/* CSV */
#dropzone {
    border: 2px dashed #999;
    padding: 12px;
    margin-bottom: 8px;
    text-align: center;
}
#dropzone.dragover { background:#f0f0f0; }

#summary { margin-top:6px; font-size:9pt; }
</style>
</head>

<body>

<div class="no-print">

    <!-- 🌍 LANGUAGE BAR -->
    <div id="langbar">
        <strong>Language:</strong>
        <button onclick="setLang('en')">EN</button>
        <button onclick="setLang('nl')">NL</button>
        <button onclick="setLang('de')">DE</button>
        <button onclick="setLang('hi')">HI</button>
    </div>
    <br>

    <div id="dropzone"></div>

    <textarea id="input" rows="5" cols="60"></textarea><br><br>

    <button onclick="generate()" id="btnGen"></button>
    <button onclick="setLayout('a')" id="btnA"></button>
    <button onclick="setLayout('b')" id="btnB"></button>
    <button onclick="exportPDF()" id="btnPDF"></button>
    <button onclick="window.print()" id="btnPrint"></button>

    <div id="summary"></div>
</div>

<div id="page" class="layout-a"></div>

<script>
/* ======================
   TRANSLATIONS
====================== */
const T = {
    en: {
        drop: "📂 Drop CSV file here (first column = barcode)",
        placeholder: "One GS1 barcode per line",
        gen: "Generate barcodes",
        la: "Layout A",
        lb: "Layout B",
        pdf: "Export PDF",
        print: "Print A4",
        empty: "No barcodes entered",
        ok: (g,b)=>`✅ ${g} generated, ❌ ${b} blocked`
    },
    nl: {
        drop: "📂 Sleep hier een CSV bestand (eerste kolom = barcode)",
        placeholder: "1 barcode per regel",
        gen: "Genereer barcodes",
        la: "Layout A",
        lb: "Layout B",
        pdf: "Exporteer PDF",
        print: "Print A4",
        empty: "Geen barcodes opgegeven",
        ok: (g,b)=>`✅ ${g} gegenereerd, ❌ ${b} geblokkeerd`
    },
    de: {
        drop: "📂 CSV-Datei hier ablegen (erste Spalte = Barcode)",
        placeholder: "Ein GS1-Barcode pro Zeile",
        gen: "Barcodes erzeugen",
        la: "Layout A",
        lb: "Layout B",
        pdf: "PDF exportieren",
        print: "A4 drucken",
        empty: "Keine Barcodes eingegeben",
        ok: (g,b)=>`✅ ${g} erzeugt, ❌ ${b} blockiert`
    },
    hi: {
        drop: "📂 CSV फ़ाइल यहाँ डालें (पहला कॉलम = बारकोड)",
        placeholder: "प्रति पंक्ति एक GS1 बारकोड",
        gen: "बारकोड बनाएँ",
        la: "लेआउट A",
        lb: "लेआउट B",
        pdf: "PDF निर्यात करें",
        print: "A4 प्रिंट करें",
        empty: "कोई बारकोड नहीं डाला गया",
        ok: (g,b)=>`✅ ${g} बने, ❌ ${b} रोके गए`
    }
};

let LANG = 'en';

function setLang(l) {
    LANG = l;
    const t = T[l];

    dropzone.textContent = t.drop;
    input.placeholder = t.placeholder;
    btnGen.textContent = t.gen;
    btnA.textContent = t.la;
    btnB.textContent = t.lb;
    btnPDF.textContent = t.pdf;
    btnPrint.textContent = t.print;
}

/* ======================
   BASIC FUNCTIONS
====================== */
function setLayout(t) {
    page.className = `layout-${t}`;
}

function exportPDF() {
    window.print();
}

/* ======================
   GENERATE
====================== */
async function generate() {
    page.innerHTML = '';
    summary.textContent = '';

    const lines = input.value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    if (!lines.length) {
        summary.textContent = T[LANG].empty;
        return;
    }

    const res = await fetch(`/generate?texts=${encodeURIComponent(lines.join('\n'))}`);
    const data = await res.json();

    let ok = 0, bad = 0;

    data.forEach(d => {
        const div = document.createElement('div');
        div.className = 'label';

        if (d.image) {
            ok++;
            div.innerHTML = `<img src="${d.image}"><div class="text">${d.text}</div>`;
        } else {
            bad++;
            div.innerHTML = `<div style="color:red;font-size:8pt">${d.text}<br>${d.error}</div>`;
        }
        page.appendChild(div);
    });

    summary.textContent = T[LANG].ok(ok, bad);
}

/* ======================
   CSV DRAG & DROP
====================== */
const dropzone = document.getElementById('dropzone');
const input = document.getElementById('input');
const page = document.getElementById('page');
const summary = document.getElementById('summary');

dropzone.addEventListener('dragover', e => {
    e.preventDefault();
    dropzone.classList.add('dragover');
});
dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('dragover');
});
dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (!f || !f.name.endsWith('.csv')) return;
    const r = new FileReader();
    r.onload = () => {
        input.value = r.result
            .split(/\r?\n/)
            .map(l=>l.split(',')[0].trim())
            .filter(Boolean)
            .join('\n');
    };
    r.readAsText(f);
});

/* INIT */
setLang('en');
</script>

</body>
</html>
