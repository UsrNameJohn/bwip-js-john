<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A4 Barcode Print</title>

<style>
@page {
    size: A4;
    margin: 10mm;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
}

.no-print {
    margin: 10px;
}

@media print {
    .no-print {
        display: none;
    }
}

/* ======================
   A4 layouts
====================== */
#page {
    display: grid;
    gap: 5mm;
    padding: 10mm;
}

#page.layout-a {
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 35mm;
}

#page.layout-b {
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 25mm;
}

/* ======================
   Label
====================== */
.label {
    border: 1px dashed #ccc;
    padding: 2mm;
    box-sizing: border-box;
    text-align: center;
}

.label img {
    max-width: 100%;
    height: auto;
}

.label .text {
    font-size: 8pt;
    margin-top: 2mm;
    word-break: break-all;
}

/* ======================
   CSV Drag & Drop
====================== */
#dropzone {
    border: 2px dashed #999;
    padding: 15px;
    margin-bottom: 10px;
    text-align: center;
    color: #555;
}

#dropzone.dragover {
    background: #f0f0f0;
}
</style>
</head>

<body>

<div class="no-print">

    <!-- Language selector -->
    <select id="language" onchange="setLanguage(this.value)">
        <option value="en">English</option>
        <option value="nl">Nederlands</option>
        <option value="de">Deutsch</option>
        <option value="hi">हिन्दी</option>
    </select>

    <br><br>

    <div id="dropzone" data-i18n="dropzone"></div>

    <textarea id="input" rows="5" cols="60"
        data-i18n-placeholder="placeholder"></textarea>

    <br><br>

    <button data-i18n="generate" onclick="generate()"></button>
    <button data-i18n="layoutA" onclick="setLayout('a')"></button>
    <button data-i18n="layoutB" onclick="setLayout('b')"></button>
    <button data-i18n="exportPDF" onclick="exportPDF()"></button>
    <button data-i18n="print" onclick="window.print()"></button>
</div>

<div id="page" class="layout-a"></div>

<script>
/* ======================
   Translations
====================== */
const translations = {
    en: {
        dropzone: "📂 Drag & drop a CSV file here (first column = barcode)",
        placeholder: "One barcode per line",
        generate: "Generate barcodes",
        layoutA: "Layout A",
        layoutB: "Layout B",
        exportPDF: "Export PDF",
        print: "Print A4",
        noInput: "No barcodes provided",
        csvOnly: "Only CSV files are allowed",
        error: "Error"
    },
    nl: {
        dropzone: "📂 Sleep hier een CSV-bestand (eerste kolom = barcode)",
        placeholder: "Eén barcode per regel",
        generate: "Genereer barcodes",
        layoutA: "Layout A",
        layoutB: "Layout B",
        exportPDF: "Exporteer PDF",
        print: "Print A4",
        noInput: "Geen barcodes opgegeven",
        csvOnly: "Alleen CSV-bestanden toegestaan",
        error: "Fout"
    },
    de: {
        dropzone: "📂 CSV-Datei hier ablegen (erste Spalte = Barcode)",
        placeholder: "Ein Barcode pro Zeile",
        generate: "Barcodes erzeugen",
        layoutA: "Layout A",
        layoutB: "Layout B",
        exportPDF: "PDF exportieren",
        print: "A4 drucken",
        noInput: "Keine Barcodes eingegeben",
        csvOnly: "Nur CSV-Dateien erlaubt",
        error: "Fehler"
    },
    hi: {
        dropzone: "📂 यहाँ CSV फ़ाइल डालें (पहला कॉलम = बारकोड)",
        placeholder: "प्रति पंक्ति एक बारकोड",
        generate: "बारकोड बनाएँ",
        layoutA: "लेआउट A",
        layoutB: "लेआउट B",
        exportPDF: "PDF निर्यात करें",
        print: "A4 प्रिंट करें",
        noInput: "कोई बारकोड नहीं दिया गया",
        csvOnly: "केवल CSV फ़ाइलें अनुमत हैं",
        error: "त्रुटि"
    }
};

function setLanguage(lang) {
    const t = translations[lang];
    window.i18n = t;

    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t[el.dataset.i18n];
    });

    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t[el.dataset.i18nPlaceholder];
    });
}

setLanguage('en');

/* ======================
   Layout switch
====================== */
function setLayout(type) {
    const page = document.getElementById('page');
    page.classList.remove('layout-a', 'layout-b');
    page.classList.add(`layout-${type}`);
}

/* ======================
   Barcode generation
====================== */
async function generate() {
    const input = document.getElementById('input').value.trim();
    const page = document.getElementById('page');
    page.innerHTML = '';

    if (!input) {
        alert(window.i18n.noInput);
        return;
    }

    const res = await fetch(`/generate?texts=${encodeURIComponent(input)}`);
    const data = await res.json();

    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'label';

        if (item.image) {
            div.innerHTML = `
                <img src="${item.image}">
                <div class="text">${item.text}</div>
            `;
        } else {
            div.innerHTML = `
                <div style="color:red;font-size:8pt">
                    ${window.i18n.error}<br>${item.text}<br>${item.error}
                </div>
            `;
        }
        page.appendChild(div);
    });
}

/* ======================
   PDF export
====================== */
function exportPDF() {
    window.print();
}

/* ======================
   CSV Drag & Drop
====================== */
const dropzone = document.getElementById('dropzone');
const textarea = document.getElementById('input');

dropzone.addEventListener('dragover', e => {
    e.preventDefault();
    dropzone.classList.add('dragover');
});

dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('dragover');
});

dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');

    const file = e.dataTransfer.files[0];
    if (!file || !file.name.endsWith('.csv')) {
        alert(window.i18n.csvOnly);
        return;
    }

    const reader = new FileReader();
    reader.onload = () => {
        const lines = reader.result
            .split(/\r?\n/)
            .map(l => l.split(',')[0].trim())
            .filter(Boolean);

        textarea.value = lines.join('\n');
    };
    reader.readAsText(file);
});
</script>

</body>
</html>
