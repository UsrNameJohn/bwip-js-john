<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A4 Barcode Generator</title>

<style>
@page {
    size: A4;
    margin: 10mm;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
}

.no-print {
    margin: 10px;
}

@media print {
    .no-print {
        display: none;
    }
}

/* ===== Layouts ===== */
#page {
    display: grid;
    gap: 5mm;
    padding: 10mm;
}

#page.layout-a {
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 35mm;
}

#page.layout-b {
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 25mm;
}

/* ===== Labels ===== */
.label {
    border: 1px dashed #ccc;
    padding: 2mm;
    box-sizing: border-box;
    text-align: center;
}

.label img {
    max-width: 100%;
}

.label .text {
    font-size: 8pt;
    margin-top: 2mm;
    word-break: break-all;
}

/* ===== Progress ===== */
#progress {
    margin-top: 10px;
    font-size: 12px;
    font-weight: bold;
}

/* ===== Dropzone ===== */
#dropzone {
    border: 2px dashed #999;
    padding: 15px;
    margin-bottom: 10px;
    text-align: center;
    color: #555;
}
#dropzone.dragover {
    background: #f0f0f0;
}
</style>
</head>

<body>

<div class="no-print">

    <select id="lang" onchange="setLanguage(this.value)">
        <option value="en">English</option>
        <option value="nl">Nederlands</option>
        <option value="de">Deutsch</option>
        <option value="hi">Hindi</option>
    </select>

    <div id="dropzone">📂 Drop CSV file (first column = barcode)</div>

    <textarea id="input" rows="5" cols="60"
        placeholder="1 barcode per line"></textarea>
    <br><br>

    <button onclick="generate()">Generate</button>
    <button onclick="setLayout('a')">Layout A</button>
    <button onclick="setLayout('b')">Layout B</button>
    <button onclick="window.print()">Download PDF</button>

    <div id="progress"></div>
</div>

<div id="page" class="layout-a"></div>

<script>
/* ===== Translations ===== */
const translations = {
    en: {
        noInput: 'No barcodes provided',
        fetching: 'Generating',
        rendering: 'Rendering',
        done: 'Done',
    },
    nl: {
        noInput: 'Geen barcodes opgegeven',
        fetching: 'Genereren',
        rendering: 'Renderen',
        done: 'Klaar',
    },
    de: {
        noInput: 'Keine Barcodes eingegeben',
        fetching: 'Erzeuge',
        rendering: 'Rendern',
        done: 'Fertig',
    },
    hi: {
        noInput: 'कोई बारकोड नहीं दिया गया',
        fetching: 'जनरेट हो रहा है',
        rendering: 'रेंडर हो रहा है',
        done: 'तैयार',
    }
};

let currentLang = 'en';

/* ===== Language ===== */
function setLanguage(lang) {
    currentLang = lang;
}

/* ===== Layout ===== */
function setLayout(type) {
    const page = document.getElementById('page');
    page.className = `layout-${type}`;
}

/* ===== Bulk Generation + Progress ===== */
async function generate() {
    const t = translations[currentLang];
    const input = document.getElementById('input').value.trim();
    const page = document.getElementById('page');
    const progress = document.getElementById('progress');

    page.innerHTML = '';
    progress.textContent = '';

    if (!input) {
        alert(t.noInput);
        return;
    }

    const lines = input.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const total = lines.length;

    progress.textContent = `${t.fetching}: 0 / ${total}`;

    const res = await fetch(`/generate?texts=${encodeURIComponent(lines.join('\n'))}`);
    const data = await res.json();

    let rendered = 0;

    for (const item of data) {
        const div = document.createElement('div');
        div.className = 'label';

        if (item.image) {
            div.innerHTML = `
                <img src="${item.image}">
                <div class="text">${item.text}</div>
            `;
        } else {
            div.innerHTML = `
                <div style="color:red;font-size:8pt">
                    ${item.text}<br>${item.error}
                </div>
            `;
        }

        page.appendChild(div);
        rendered++;

        progress.textContent =
            `${t.rendering}: ${rendered} / ${total}`;

        await new Promise(r => setTimeout(r, 10));
    }

    progress.textContent = t.done;
}

/* ===== CSV Drag & Drop ===== */
const dropzone = document.getElementById('dropzone');
const textarea = document.getElementById('input');

dropzone.addEventListener('dragover', e => {
    e.preventDefault();
    dropzone.classList.add('dragover');
});

dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('dragover');
});

dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');

    const file = e.dataTransfer.files[0];
    if (!file || !file.name.endsWith('.csv')) {
        alert('CSV only');
        return;
    }

    const reader = new FileReader();
    reader.onload = () => {
        const lines = reader.result
            .split(/\r?\n/)
            .map(l => l.split(',')[0].trim())
            .filter(Boolean);

        textarea.value = lines.join('\n');
    };
    reader.readAsText(file);
});
</script>

</body>
</html>
