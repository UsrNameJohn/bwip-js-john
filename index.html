<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>A4 Barcode Print</title>

<style>
@page {
    size: A4;
    margin: 10mm;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
}

/* Niet printen */
.no-print {
    margin: 10px;
}

@media print {
    .no-print {
        display: none;
    }
}

/* ======================
   A4 layouts
====================== */
#page {
    display: grid;
    gap: 5mm;
    padding: 10mm;
}

/* Layout A – groot */
#page.layout-a {
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 35mm;
}

/* Layout B – klein */
#page.layout-b {
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 25mm;
}

/* ======================
   Label
====================== */
.label {
    border: 1px dashed #ccc; /* tijdelijk */
    padding: 2mm;
    box-sizing: border-box;
    text-align: center;
}

.label img {
    max-width: 100%;
    height: auto;
}

.label .text {
    font-size: 8pt;
    margin-top: 2mm;
    word-break: break-all;
}
</style>
</head>

<body>

<div class="no-print">
    <textarea
        id="input"
        rows="5"
        cols="60"
        placeholder="1 barcode per regel"></textarea>
    <br><br>

    <button onclick="generate()">Genereer barcodes</button>
    <button onclick="setLayout('a')">Layout A</button>
    <button onclick="setLayout('b')">Layout B</button>
    <button onclick="window.print()">Print A4</button>
</div>

<!-- Start in layout A -->
<div id="page" class="layout-a"></div>

<script>
function setLayout(type) {
    const page = document.getElementById('page');
    page.classList.remove('layout-a', 'layout-b');
    page.classList.add(`layout-${type}`);
}

async function generate() {
    const inputEl = document.getElementById('input');
    const page = document.getElementById('page');
    const input = inputEl.value.trim();

    page.innerHTML = '';

    if (!input) {
        alert('Voer minimaal één barcode in.');
        return;
    }

    let res;
    try {
        res = await fetch(
            `/generate?texts=${encodeURIComponent(input)}`
        );
    } catch {
        alert('Server niet bereikbaar');
        return;
    }

    if (!res.ok) {
        const text = await res.text();
        alert('Serverfout: ' + text);
        return;
    }

    let data;
    try {
        data = await res.json();
    } catch {
        alert('Ongeldig serverantwoord');
        return;
    }

    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'label';

        if (item.image) {
            div.innerHTML = `
                <img src="${item.image}">
                <div class="text">${item.text}</div>
            `;
        } else {
            div.innerHTML = `
                <div style="color:red;font-size:8pt">
                    Fout:<br>${item.text}<br>
                    ${item.error}
                </div>
            `;
        }

        page.appendChild(div);
    });
}
</script>

</body>
</html>
