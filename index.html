<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>A4 Barcode Print</title>

<style>
@page {
    size: A4;
    margin: 10mm;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
}

/* Knoppen niet printen */
.no-print {
    margin: 10px;
}

@media print {
    .no-print {
        display: none;
    }
}

/* A4 raster */
#page {
    display: grid;
    grid-template-columns: 1fr;
    grid-auto-rows: 55mm;
    gap: 6mm;
    padding: 10mm;
}


/* Label */
.label {
    border: 1px dashed #ccc; /* tijdelijk */
    padding: 2mm;
    box-sizing: border-box;
    text-align: center;
}

.label img {
    max-width: 100%;
}

.label .text {
    font-size: 8pt;
    margin-top: 2mm;
}
</style>
</head>

<body>

<div class="no-print">
    <textarea id="input" rows="5" cols="60"
        placeholder="1 barcode per regel"></textarea><br><br>

    <button onclick="generate()">Genereer barcodes</button>
    <button onclick="window.print()">Print A4</button>
</div>

<div id="page"></div>

<script>
async function generate() {
    const input = document.getElementById('input').value;

    const res = await fetch(
        `/generate?texts=${encodeURIComponent(input)}`
    );

    const data = await res.json();

    const page = document.getElementById('page');
    page.innerHTML = '';

    data.forEach(item => {
        if (!item.image) return;

        const div = document.createElement('div');
        div.className = 'label';

        div.innerHTML = `
            <img src="${item.image}">
            <div class="text">${item.text}</div>
        `;

        page.appendChild(div);
    });
}
</script>

</body>
</html>
