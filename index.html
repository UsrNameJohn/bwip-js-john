<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A4 Barcode Print</title>

<style>
@page {
    size: A4;
    margin: 10mm;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
}

.no-print {
    margin: 10px;
}

@media print {
    .no-print {
        display: none;
    }
}

/* ======================
   Language buttons
====================== */
.lang-buttons button {
    margin-right: 5px;
}

/* ======================
   A4 layouts
====================== */
#page {
    display: grid;
    gap: 5mm;
    padding: 10mm;
}

#page.layout-a {
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 35mm;
}

#page.layout-b {
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 25mm;
}

/* ======================
   Label
====================== */
.label {
    border: 1px dashed #ccc;
    padding: 2mm;
    box-sizing: border-box;
    text-align: center;
}

.label img {
    max-width: 100%;
    height: auto;
}

.label .text {
    font-size: 8pt;
    margin-top: 2mm;
    word-break: break-all;
}

/* ======================
   CSV Drag & Drop
====================== */
#dropzone {
    border: 2px dashed #999;
    padding: 15px;
    margin-bottom: 10px;
    text-align: center;
    color: #555;
}
#dropzone.dragover {
    background: #f0f0f0;
}

/* ======================
   Progress
====================== */
#progress {
    margin-top: 10px;
    font-size: 9pt;
}
</style>
</head>

<body>

<div class="no-print">

    <div class="lang-buttons">
        <button onclick="setLanguage('en')">EN</button>
        <button onclick="setLanguage('nl')">NL</button>
        <button onclick="setLanguage('de')">DE</button>
        <button onclick="setLanguage('hi')">IN</button>
    </div>
    <br>

    <div id="dropzone" data-i18n="dropCsv"></div>

    <textarea id="input" rows="5" cols="60"
        data-i18n-placeholder="placeholder"></textarea>
    <br><br>

    <button onclick="generate()" data-i18n="generate"></button>
    <button onclick="cancelGeneration()" data-i18n="cancel"></button>
    <button onclick="setLayout('a')" data-i18n="layoutA"></button>
    <button onclick="setLayout('b')" data-i18n="layoutB"></button>
    <button onclick="window.print()" data-i18n="print"></button>

    <div id="progress"></div>
</div>

<div id="page" class="layout-a"></div>

<script>
/* ======================
   Translations
====================== */
const translations = {
    en: {
        dropCsv: "📂 Drop CSV file here (first column = barcode)",
        placeholder: "1 barcode per line",
        generate: "Generate",
        cancel: "Cancel",
        layoutA: "Layout A",
        layoutB: "Layout B",
        print: "Print A4",
        noInput: "No barcodes entered",
        fetching: "Fetching",
        rendering: "Rendering",
        done: "Done",
        cancelled: "Cancelled",
        remaining: "Remaining"
    },
    nl: {
        dropCsv: "📂 Sleep CSV bestand hierheen (eerste kolom = barcode)",
        placeholder: "1 barcode per regel",
        generate: "Genereer",
        cancel: "Annuleren",
        layoutA: "Layout A",
        layoutB: "Layout B",
        print: "Print A4",
        noInput: "Geen barcodes opgegeven",
        fetching: "Ophalen",
        rendering: "Renderen",
        done: "Klaar",
        cancelled: "Geannuleerd",
        remaining: "Resterend"
    },
    de: {
        dropCsv: "📂 CSV-Datei hier ablegen (erste Spalte = Barcode)",
        placeholder: "1 Barcode pro Zeile",
        generate: "Erzeugen",
        cancel: "Abbrechen",
        layoutA: "Layout A",
        layoutB: "Layout B",
        print: "A4 drucken",
        noInput: "Keine Barcodes eingegeben",
        fetching: "Laden",
        rendering: "Rendern",
        done: "Fertig",
        cancelled: "Abgebrochen",
        remaining: "Verbleibend"
    },
    hi: {
        dropCsv: "📂 CSV फ़ाइल यहाँ छोड़ें (पहला कॉलम = बारकोड)",
        placeholder: "प्रति पंक्ति 1 बारकोड",
        generate: "जनरेट करें",
        cancel: "रद्द करें",
        layoutA: "लेआउट A",
        layoutB: "लेआउट B",
        print: "A4 प्रिंट करें",
        noInput: "कोई बारकोड नहीं दिया गया",
        fetching: "लोड हो रहा है",
        rendering: "बनाया जा रहा है",
        done: "पूरा",
        cancelled: "रद्द",
        remaining: "शेष"
    }
};

let currentLang = 'en';
let cancelled = false;

/* ======================
   Language handling
====================== */
function applyTranslations() {
    const t = translations[currentLang];

    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t[el.dataset.i18n];
    });

    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t[el.dataset.i18nPlaceholder];
    });
}

function setLanguage(lang) {
    currentLang = lang;
    applyTranslations();
}

window.onload = applyTranslations;

/* ======================
   Layout switch
====================== */
function setLayout(type) {
    const page = document.getElementById('page');
    page.classList.remove('layout-a', 'layout-b');
    page.classList.add(`layout-${type}`);
}

/* ======================
   Barcode generation
====================== */
async function generate() {
    cancelled = false;
    const t = translations[currentLang];

    const input = document.getElementById('input').value.trim();
    const page = document.getElementById('page');
    const progress = document.getElementById('progress');
    page.innerHTML = '';
    progress.textContent = '';

    if (!input) {
        alert(t.noInput);
        return;
    }

    const lines = input.split('\n').filter(Boolean);
    const total = lines.length;

    for (let i = 0; i < total; i++) {
        if (cancelled) {
            progress.textContent = t.cancelled;
            return;
        }

        progress.textContent =
            `${t.fetching} ${i + 1}/${total} – ${t.remaining}: ${total - i}`;

        const res = await fetch(`/generate?texts=${encodeURIComponent(lines[i])}`);
        const data = await res.json();

        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'label';

            if (item.image) {
                div.innerHTML = `
                    <img src="${item.image}">
                    <div class="text">${item.text}</div>
                `;
            } else {
                div.innerHTML = `
                    <div style="color:red;font-size:8pt">
                        ${item.error}
                    </div>
                `;
            }
            page.appendChild(div);
        });

        progress.textContent =
            `${t.rendering} ${i + 1}/${total}`;
    }

    progress.textContent = t.done;
}

function cancelGeneration() {
    cancelled = true;
}

/* ======================
   CSV Drag & Drop
====================== */
const dropzone = document.getElementById('dropzone');
const textarea = document.getElementById('input');

dropzone.addEventListener('dragover', e => {
    e.preventDefault();
    dropzone.classList.add('dragover');
});

dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('dragover');
});

dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');

    const file = e.dataTransfer.files[0];
    if (!file || !file.name.endsWith('.csv')) return;

    const reader = new FileReader();
    reader.onload = () => {
        const lines = reader.result
            .split(/\r?\n/)
            .map(l => l.split(',')[0].trim())
            .filter(Boolean);

        textarea.value = lines.join('\n');
    };
    reader.readAsText(file);
});
</script>

</body>
</html>
