<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A4 Barcode Print</title>

<style>
@page {
    size: A4;
    margin: 10mm;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
}

/* ======================
   Controls
====================== */
.no-print {
    margin: 10px;
}

@media print {
    .no-print {
        display: none;
    }
}

button {
    margin-right: 5px;
}

/* ======================
   Progress
====================== */
#progress-wrapper {
    width: 100%;
    height: 10px;
    background: #ddd;
    border-radius: 5px;
    overflow: hidden;
    margin-top: 8px;
    display: none;
}

#progress-bar {
    height: 100%;
    width: 0%;
    background: #2196f3;
    transition: width 0.2s linear, background 0.2s linear;
}

#status {
    font-size: 14px;
    margin-top: 6px;
}

#eta {
    font-size: 12px;
    color: #666;
}

/* ======================
   Layouts
====================== */
#page {
    display: grid;
    gap: 5mm;
    padding: 10mm;
}

#page.layout-a {
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 35mm;
}

#page.layout-b {
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 25mm;
}

/* ======================
   Labels
====================== */
.label {
    border: 1px dashed #ccc;
    padding: 2mm;
    box-sizing: border-box;
    text-align: center;
}

.label img {
    max-width: 100%;
}

.label .text {
    font-size: 8pt;
    margin-top: 2mm;
    word-break: break-all;
}

/* ======================
   Dropzone
====================== */
#dropzone {
    border: 2px dashed #999;
    padding: 15px;
    margin-bottom: 10px;
    text-align: center;
    color: #555;
}

#dropzone.dragover {
    background: #f0f0f0;
}
</style>
</head>

<body>

<div class="no-print">

    <div id="dropzone">
        📂 Drop CSV file here (first column = barcode)
    </div>

    <textarea id="input" rows="5" cols="60"
        placeholder="1 barcode per line"></textarea>
    <br><br>

    <button id="btn-generate" onclick="generate()">Generate</button>
    <button onclick="cancelGeneration()">Cancel</button>
    <button onclick="setLayout('a')">Layout A</button>
    <button onclick="setLayout('b')">Layout B</button>
    <button onclick="window.print()">Print A4</button>

    <div id="status"></div>
    <div id="eta"></div>

    <div id="progress-wrapper">
        <div id="progress-bar"></div>
    </div>
</div>

<div id="page" class="layout-a"></div>

<script>
/* ======================
   State
====================== */
let cancelled = false;
let startTime = 0;

/* ======================
   Helpers
====================== */
function setLayout(type) {
    const page = document.getElementById('page');
    page.className = `layout-${type}`;
}

function setProgress(percent, color) {
    const wrapper = document.getElementById('progress-wrapper');
    const bar = document.getElementById('progress-bar');
    wrapper.style.display = 'block';
    bar.style.width = percent + '%';
    bar.style.background = color;
}

function resetProgress() {
    document.getElementById('progress-wrapper').style.display = 'none';
    document.getElementById('progress-bar').style.width = '0%';
    document.getElementById('eta').textContent = '';
}

function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2,'0')}`;
}

/* ======================
   Cancel
====================== */
function cancelGeneration() {
    cancelled = true;
    document.getElementById('status').textContent = 'Cancelled';
    resetProgress();
}

/* ======================
   Generate
====================== */
async function generate() {
    const input = document.getElementById('input').value.trim();
    const page = document.getElementById('page');
    const status = document.getElementById('status');
    const eta = document.getElementById('eta');
    const btn = document.getElementById('btn-generate');

    if (!input) {
        status.textContent = 'No barcodes entered';
        return;
    }

    cancelled = false;
    btn.disabled = true;
    page.innerHTML = '';
    startTime = Date.now();

    const lines = input.split('\n').filter(Boolean);
    const total = lines.length;

    /* Phase 1: Fetch */
    status.textContent = 'Fetching barcodes…';
    setProgress(10, '#2196f3');

    // NOTE:
    // This currently fetches everything at once.
    // Backend streaming (ReadableStream) can replace this later.
    const res = await fetch(`/generate?texts=${encodeURIComponent(input)}`);
    const data = await res.json();

    /* Phase 2: Render */
    status.textContent = 'Rendering barcodes…';
    setProgress(15, '#ff9800');

    for (let i = 0; i < data.length; i++) {
        if (cancelled) break;

        const item = data[i];
        const div = document.createElement('div');
        div.className = 'label';

        if (item.image) {
            div.innerHTML = `
                <img src="${item.image}">
                <div class="text">${item.text}</div>
            `;
        } else {
            div.innerHTML = `
                <div style="color:red;font-size:8pt">
                    Error<br>${item.text}
                </div>
            `;
        }

        page.appendChild(div);

        const done = i + 1;
        const percent = 15 + (done / total) * 85;
        setProgress(percent, '#ff9800');

        const elapsed = (Date.now() - startTime) / 1000;
        const avg = elapsed / done;
        eta.textContent = `Remaining: ${formatTime(avg * (total - done))}`;

        await new Promise(r => setTimeout(r, 20));
    }

    if (!cancelled) {
        status.textContent = 'Done ✅';
        setProgress(100, '#4caf50');
        setTimeout(resetProgress, 800);
    }

    btn.disabled = false;
}
</script>

</body>
</html>
