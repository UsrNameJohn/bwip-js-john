<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>A4 Barcode Print</title>

<style>
@page {
    size: A4;
    margin: 10mm;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
}

/* Niet printen */
.no-print {
    margin: 10px;
}

@media print {
    .no-print {
        display: none;
    }
}

/* ======================
   A4 layouts
====================== */
#page {
    display: grid;
    gap: 5mm;
    padding: 10mm;
}

#page.layout-a {
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 35mm;
}

#page.layout-b {
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 25mm;
}

/* ======================
   Label
====================== */
.label {
    border: 1px dashed #ccc;
    padding: 2mm;
    box-sizing: border-box;
    text-align: center;
}

.label img {
    max-width: 100%;
    height: auto;
}

.label .text {
    font-size: 8pt;
    margin-top: 2mm;
    word-break: break-all;
}

/* ======================
   CSV Drag & Drop
====================== */
#dropzone {
    border: 2px dashed #999;
    padding: 15px;
    margin-bottom: 10px;
    text-align: center;
    color: #555;
}
#dropzone.dragover {
    background: #f0f0f0;
}
</style>
</head>

<body>

<div class="no-print">

    <div id="dropzone">
        📂 Sleep hier een CSV bestand (eerste kolom = barcode)
    </div>

    <textarea id="input" rows="5" cols="60"
        placeholder="1 barcode per regel"></textarea>
    <br><br>

    <button onclick="generate()">Genereer barcodes</button>
    <button onclick="setLayout('a')">Layout A</button>
    <button onclick="setLayout('b')">Layout B</button>
    <button onclick="exportPDF()">Exporteer PDF</button>
    <button onclick="window.print()">Print A4</button>
</div>

<div id="page" class="layout-a"></div>

<script>
/* ======================
   Layout switch
====================== */
function setLayout(type) {
    const page = document.getElementById('page');
    page.classList.remove('layout-a', 'layout-b');
    page.classList.add(`layout-${type}`);
}

/* ======================
   Barcode generatie
====================== */
async function generate() {
    const input = document.getElementById('input').value.trim();
    const page = document.getElementById('page');
    page.innerHTML = '';

    if (!input) {
        alert('Geen barcodes opgegeven');
        return;
    }

    const res = await fetch(
        `/generate?texts=${encodeURIComponent(input)}`
    );

    if (!res.ok) {
        alert(await res.text());
        return;
    }

    const data = await res.json();

    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'label';

        if (item.image) {
            div.innerHTML = `
                <img src="${item.image}">
                <div class="text">${item.text}</div>
            `;
        } else {
            div.innerHTML = `
                <div style="color:red;font-size:8pt">
                    Fout:<br>${item.text}<br>${item.error}
                </div>
            `;
        }
        page.appendChild(div);
    });
}

/* ======================
   PDF export
====================== */
function exportPDF() {
    window.print();
}

/* ======================
   CSV Drag & Drop
====================== */
const dropzone = document.getElementById('dropzone');
const textarea = document.getElementById('input');

dropzone.addEventListener('dragover', e => {
    e.preventDefault();
    dropzone.classList.add('dragover');
});

dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('dragover');
});

dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');

    const file = e.dataTransfer.files[0];
    if (!file || !file.name.endsWith('.csv')) {
        alert('Alleen CSV bestanden toegestaan');
        return;
    }

    const reader = new FileReader();
    reader.onload = () => {
        const lines = reader.result
            .split(/\r?\n/)
            .map(l => l.split(',')[0].trim())
            .filter(Boolean);

        textarea.value = lines.join('\n');
    };
    reader.readAsText(file);
});
</script>

</body>
</html>
