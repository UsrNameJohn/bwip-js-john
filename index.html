<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A4 Barcode Tool</title>

<style>
@page { size: A4; margin: 10mm; }

body {
    font-family: Arial, sans-serif;
    margin: 0;
}

.no-print { margin: 10px; }

@media print {
    .no-print { display: none; }
}

#page {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 35mm;
    gap: 5mm;
    padding: 10mm;
}

.label {
    border: 1px dashed #ccc;
    padding: 2mm;
    text-align: center;
}

.label img {
    max-width: 100%;
}

.label .text {
    font-size: 8pt;
    margin-top: 2mm;
    word-break: break-all;
}
</style>
</head>

<body>

<div class="no-print">
    <textarea id="input" rows="6" cols="60"
        placeholder="One barcode per line"></textarea><br><br>

    <button onclick="generate()">Preview</button>
    <button onclick="downloadZip()">Download ZIP (SVG)</button>
    <button onclick="window.print()">Print A4</button>
</div>

<div id="page"></div>

<script>
async function generate() {
    const input = document.getElementById('input').value.trim();
    const page = document.getElementById('page');
    page.innerHTML = '';

    if (!input) {
        alert('No barcodes entered');
        return;
    }

    const res = await fetch('/generate?texts=' + encodeURIComponent(input));
    const data = await res.json();

    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'label';

        if (item.image) {
            div.innerHTML = `
                <img src="${item.image}">
                <div class="text">${item.text}</div>
            `;
        } else {
            div.innerHTML = `<div style="color:red">${item.error}</div>`;
        }

        page.appendChild(div);
    });
}

function downloadZip() {
    const input = document.getElementById('input').value.trim();
    if (!input) {
        alert('No barcodes entered');
        return;
    }
    window.location.href =
        '/export-zip?texts=' + encodeURIComponent(input);
}
</script>

</body>
</html>
